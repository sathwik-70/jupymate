        import { Buffer } from "https://esm.sh/buffer@6.0.3";

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              jup: {
                dark: 'var(--jup-dark)',
                card: 'var(--jup-card)',
                surface: 'var(--jup-surface)',
                primary: 'var(--jup-primary)',
                secondary: 'var(--jup-secondary)',
                accent: 'var(--jup-accent)',
                text: 'var(--jup-text)',
                muted: 'var(--jup-muted)'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in-up': 'fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'blob': 'blob 15s infinite ease-in-out',
              'shimmer': 'shimmer 3s infinite linear',
              'spin-slow': 'spin 8s linear infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              fadeInUp: { 
                '0%': { opacity: '0', transform: 'translateY(20px)' }, 
                '100%': { opacity: '1', transform: 'translateY(0)' } 
              },
              blob: {
                '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(50px, -70px) scale(1.15)' },
                '66%': { transform: 'translate(-40px, 40px) scale(0.95)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --jup-dark: #FAFAFA;
        --jup-card: rgba(255, 255, 255, 0.7);
        --jup-surface: rgba(248, 250, 252, 0.8);
        --jup-primary: #059669;
        --jup-secondary: #1E293B;
        --jup-accent: #2563EB; 
        --jup-text: #0F172A; 
        --jup-muted: #64748B;
        --mesh-1: #ECFDF5;
        --mesh-2: #EFF6FF;
        --mesh-3: #FFFFFF;
        --glass-border: rgba(255, 255, 255, 0.8);
        --glass-shadow: 0 12px 40px -12px rgba(15, 23, 42, 0.08);
      }
      .dark {
        --jup-dark: #020617;
        --jup-card: rgba(15, 23, 42, 0.6);
        --jup-surface: rgba(30, 41, 59, 0.4);
        --jup-primary: #34D399; 
        --jup-secondary: #FFFFFF;
        --jup-accent: #60A5FA;
        --jup-text: #F8FAFC;
        --jup-muted: #94A3B8;
        --mesh-1: #064E3B;
        --mesh-2: #0F172A;
        --mesh-3: #020617;
        --glass-border: rgba(255, 255, 255, 0.05);
        --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
      }
      body {
        background-color: var(--jup-dark);
        color: var(--jup-text);
        min-height: 100vh;
        overflow-x: hidden;
        transition: color 0.5s ease, background-color 0.5s ease;
      }
      .bg-mesh {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: 
          radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 50%),
          radial-gradient(at 100% 0%, var(--mesh-2) 0px, transparent 50%),
          radial-gradient(at 100% 100%, var(--mesh-1) 0px, transparent 50%),
          radial-gradient(at 0% 100%, var(--mesh-2) 0px, transparent 50%),
          var(--mesh-3);
        background-size: 150% 150%;
        animation: meshMove 20s ease infinite alternate;
      }
      @keyframes meshMove {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }
      .bg-noise {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.035;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      .glass-panel {
        background: var(--jup-card);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glass-panel:hover {
        border-color: rgba(var(--jup-primary), 0.2);
        box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.12);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--jup-muted);
        border-radius: 10px;
        opacity: 0.5;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--jup-primary); }
    </style>
